name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 is the version publish.yml builds and tests on before releasing;
        # 18/20 stay because package.json declares engines.node >= 18.
        node-version: [18, 20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # AP2 (T50): capture the SMOKE-API parity row on every leg so the
      # parity-cross-node job can prove its n6-normalized stderr is identical
      # across Node majors.
      - name: Capture SMOKE-API parity row
        run: PARITY_CAPTURE=$RUNNER_TEMP/parity-capture node --test --test-name-pattern 'row:SMOKE-API' test/parity/harness.test.mjs

      - name: Upload SMOKE-API parity capture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-smoke-api-node${{ matrix.node-version }}
          path: ${{ runner.temp }}/parity-capture
          if-no-files-found: error

  # AP2 (T50): compare each leg's SMOKE-API capture against Node 24 (the
  # reference). --cross-node is the only capture-compare mode that waives the
  # Node-major guard; it compares only stderr, and only rows in both trees.
  parity-cross-node:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Download SMOKE-API parity captures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: parity-smoke-api-node*
          path: ${{ runner.temp }}/parity

      - name: Compare each leg against Node 24
        run: |
          set -e
          for n in 18 20 22; do
            node test/parity/helpers/capture-compare.mjs --cross-node --field stderr \
              "$RUNNER_TEMP/parity/parity-smoke-api-node24" "$RUNNER_TEMP/parity/parity-smoke-api-node$n"
          done

  # The spawn path is the one place where a Windows-only defect is a security
  # defect: .cmd shims are not executable images, so they reach cmd.exe, which
  # re-parses argv and resolves unqualified names against the reviewed
  # repository. Simulating win32 through the platform/env seams on Ubuntu checks
  # our decisions but never CreateProcess, PATHEXT, or cmd.exe itself — so that
  # path is executed for real here.
  #
  # Only test/windows-spawn.test.mjs runs: the rest of the suite is not
  # Windows-portable (POSIX mode bits, `#!/bin/sh` mock CLIs) and making it so is
  # separate work.
  windows-spawn:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run Windows spawn-safety tests
        run: node --test test/windows-spawn.test.mjs
